<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8" />
<title>Home</title>
<link rel="stylesheet" href="../../css/bootstrap.min.css">
</head>
<body>
	<div class="container"
		style="display: flex; justify-content: center; align-items: center; height: 50vh; top: 0;">

		<div class="row">
			<h2>Login with Username and Password</h2>
			<form action="#" th:action="@{/app/login}" th:object="${user}"
				method="post" class="form-horizontal" style="width: 100%">
				<div class="form-group">
					<div th:if="${param.error}">
						<p style="color: red">Invalid username or password.</p>
					</div>

					<div th:if="${param.logout}">
						<p style="color: green">You have been logged out.</p>
					</div>
					<label class="col-sm-2 control-label">Username</label>
					<div class="col-sm-10">
						<input type="text" name="username" class="col-4" required>
					</div>
					<br> <label class="col-sm-2 control-label">Password</label>
					<div class="col-sm-10">
						<input type="password" name="password" class="col-4">
					</div>
					<input type="hidden" th:name="${_csrf.parameterName}"
						th:value="${_csrf.token}" /> <br>
				</div>

				<div class="form-group">
					<div class="col-sm-12">
						<input class="btn btn-primary btn-sm" type="submit" value="Login">
						<a class="btn btn-primary btn-sm" href="/app/signup">Sign up</a>
					</div>
				</div>
			</form>
		</div>

	</div>
</body>
</html>

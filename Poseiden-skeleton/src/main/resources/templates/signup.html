<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8" />
<title>Home</title>
<link rel="stylesheet" href="../../css/bootstrap.min.css">
</head>
<body>
	<div class="container"
		style="display: flex; justify-content: center; align-items: center; height: 50vh; top: 0;">

		<div class="row">
			<h2>Sign up form</h2>
			<form action="#" th:action="@{/app/signup}" th:object="${user}"
				method="post" class="form-horizontal" style="width: 100%">
				<div class="form-group">
					<div th:if="${param.error}">
						<p style="color: red">Invalid username or password.</p>
					</div>

					<div th:if="${param.logout}">
						<p style="color: green">You have been logged out.</p>
					</div>
					<label class="col-sm-2 control-label">Fullname</label>
					<div class="col-sm-10">
						<input type="text" th:field="*{fullname}" class="col-4" required>
					</div>
					<label class="col-sm-2 control-label">Username</label>
					<div class="col-sm-10">
						<input type="text" th:field="*{username}" class="col-4" required>
					</div>
					<label class="col-sm-2 control-label">Password</label>
					<div class="col-sm-10">
						<input type="password" th:field="*{password}" class="col-4" required>
					</div>
					<input type="hidden" th:name="${_csrf.parameterName}"
						th:value="${_csrf.token}" /> <br>
				</div>

				<div class="form-group">
					<div class="col-sm-12">
						<input class="btn btn-primary btn-sm" type="submit"
							value="Register">
					</div>
				</div>
			</form>
		</div>

	</div>
</body>
</html>
